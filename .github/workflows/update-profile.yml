name: Update GitHub Profile Dashboard

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import re

          username = "BHUSHANBHOI-DEVELOPER"
          readme = "README.md"

          url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "GitHub-Profile-Dashboard"
              }
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          # Remove forks and the profile repository itself
          repos = [
              repo for repo in repos
              if not repo["fork"] and repo["name"] != username
          ]

          # -----------------------------
          # Repository count
          # -----------------------------

          total_repositories = len(repos)

          # -----------------------------
          # Latest projects
          # -----------------------------

          recent_projects = repos[:6]

          project_text = "\n".join(
              f"- 🚀 [{repo['name']}]({repo['html_url']})"
              for repo in recent_projects
          )

          # -----------------------------
          # Featured projects
          # -----------------------------

          featured = repos[:6]

          featured_text = "\n".join(
              f"| 🚀 [{repo['name']}]({repo['html_url']}) | "
              f"{repo.get('description') or 'No description provided'} | "
              f"`{repo.get('language') or 'N/A'}` |"
              for repo in featured
          )

          # -----------------------------
          # Read README
          # -----------------------------

          with open(readme, "r", encoding="utf-8") as file:
              content = file.read()

          # -----------------------------
          # Update repository count
          # -----------------------------

          content = re.sub(
              r"<!-- AUTO_REPO_COUNT_START -->.*?<!-- AUTO_REPO_COUNT_END -->",
              f"""<!-- AUTO_REPO_COUNT_START -->
          **📦 Public Projects:** {total_repositories}
          <!-- AUTO_REPO_COUNT_END -->""",
              content,
              flags=re.S
          )

          # -----------------------------
          # Update Latest Projects
          # -----------------------------

          content = re.sub(
              r"<!-- AUTO_PROJECTS_START -->.*?<!-- AUTO_PROJECTS_END -->",
              f"""<!-- AUTO_PROJECTS_START -->
          {project_text}
          <!-- AUTO_PROJECTS_END -->""",
              content,
              flags=re.S
          )

          # -----------------------------
          # Update Featured Projects
          # -----------------------------

          content = re.sub(
              r"<!-- AUTO_FEATURED_PROJECTS_START -->.*?<!-- AUTO_FEATURED_PROJECTS_END -->",
              f"""<!-- AUTO_FEATURED_PROJECTS_START -->

          | 🚀 Project | 📝 Description | 🔧 Technology |
          |---|---|---|
          {featured_text}

          <!-- AUTO_FEATURED_PROJECTS_END -->""",
              content,
              flags=re.S
          )

          # -----------------------------
          # Save README
          # -----------------------------

          with open(readme, "w", encoding="utf-8") as file:
              file.write(content)

          print(f"Updated dashboard successfully.")
          print(f"Public projects: {total_repositories}")
          print(f"Featured projects: {len(featured)}")

          PY

      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "Auto-update GitHub dashboard"

          git push
